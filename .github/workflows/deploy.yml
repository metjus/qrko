# Nasadenie webu na Websupport cez FTP.
# Spúšťa sa pri každom pushi do main, ktorý mení priečinok web/, alebo ručne
# (Actions -> Deploy na Websupport -> Run workflow).
#
# Potrebné nastavenia v repe (Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR (voliteľné, predvolene ./web/ - koreň webu
#              na Websupporte; adresa musí končiť lomkou)
#
# Kým secrets nie sú vyplnené, workflow nasadenie len preskočí.
# Nahrávajú sa iba zmenené súbory. Súbory, ktoré na serveri sú, ale v repe
# nie (log formulára, overovacie súbory Search Console...), sa nemažú.

name: Deploy na Websupport

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola nastavení
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Chýba secret FTP_SERVER, nasadenie preskakujem."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Nahratie cez FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ${{ vars.FTP_SERVER_DIR || './web/' }}
          exclude: |
            **/.git*
            **/.git*/**
            odoslat-chyby.log
