# Nasadenie webu na HostCreators cez FTP (od 27. 11. 2026, predtým Websupport).
# Spúšťa sa iba ručne
# (Actions -> Deploy na HostCreators -> Run workflow).
#
# Potrebné nastavenia v repe (Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR (voliteľné, predvolene ./public/ - koreň webu
#              na HostCreators relatívne ku koreňu FTP účtu;
#              adresa musí končiť lomkou)
#              FTP_PROTOCOL (voliteľné, predvolene ftps; ak server šifrované
#              spojenie nepodporuje, nastav ftp)
#
# Kým secrets nie sú vyplnené, workflow nasadenie len preskočí.
# Nahrávajú sa iba zmenené súbory. Súbory, ktoré na serveri sú, ale v repe
# nie (log formulára, overovacie súbory Search Console...), sa nemažú.

name: Deploy na HostCreators

# Od 27. 11. 2026 nasadzuje web Git aplikácia HostCreators priamo z vetvy main
# (relatívna public cesta: web). Tento FTP workflow je preto len záložný
# a spúšťa sa iba ručne.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola nastavení
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Chýba secret FTP_SERVER, nasadenie preskakujem."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Nahratie cez FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || './public/' }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            odoslat-chyby.log
