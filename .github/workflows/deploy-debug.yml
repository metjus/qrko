name: Deploy diagnostika
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Certifikát FTP servera
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          out=$(echo | timeout 20 openssl s_client -starttls ftp -connect "$S:21" 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>&1 | tr '\n' ' ')
          echo "::notice title=CERT::$out"
